<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Emerald to Teal gradient -->
    <linearGradient id="monoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    
    <!-- Golden Coin gradient -->
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="128" height="128" rx="30" fill="url(#monoBg)"/>

  <!-- Inner glowing highlight border -->
  <rect x="3" y="3" width="122" height="122" rx="27" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- Bank Architecture with Drop Shadow -->
  <g fill="#ffffff" filter="url(#softShadow)">
    <!-- Roof / Pediment -->
    <path d="M64 19 L19 46 L109 46 Z"/>
    
    <!-- Roof Entablature Beam -->
    <rect x="19" y="49" width="90" height="7" rx="2.5"/>

    <!-- 4 Classical Columns -->
    <rect x="25" y="60" width="12" height="34" rx="2.5"/>
    <rect x="47" y="60" width="12" height="34" rx="2.5"/>
    <rect x="69" y="60" width="12" height="34" rx="2.5"/>
    <rect x="91" y="60" width="12" height="34" rx="2.5"/>

    <!-- Stepped Foundation / Plinth -->
    <rect x="18" y="97" width="92" height="7" rx="2.5"/>
    <rect x="13" y="106" width="102" height="8" rx="3.5"/>
  </g>

  <!-- Golden Coin Medallion in Pediment -->
  <circle cx="64" cy="35" r="7.5" fill="url(#goldCoin)" stroke="#b45309" stroke-width="1.2"/>
  <text x="64" y="38.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#78350f" text-anchor="middle">฿</text>
</svg>
